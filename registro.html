<!DOCTYPE html>
<html lang="es">

<body>
    <main>
        <h1>REGISTRO</h1>
        <br>
        <h2>Bienvenido nuevo usuario</h2>


        <section id="regitro">

        <!--formulario sin base de datos, es decir, no guarda nada-->
            <form action="nada">
            <label for="Nombre" >Nombre:</label>
            <input type="text" placeholder="Nombre" id="Nombre">
            <label for="Apellido" >Apellido:</label>
            <input type="text" placeholder="apellido" id="Apellido">
            <label for="Fecha de nacimiento">Fecha de nacimiento:</label>
            <input type="date" placeholder="Fecha de nacimiento" id="Fecha de nacimiento">
            <br>
            <br>
            <label for="Genero">Genero:</label>
            <input type="text" placeholder="Genero" id="Genero">
            <label for="Profesion" >Profesion:</label>
            <input type="text" placeholder="profesion" id="Profesion">
            <label for="Matricula">Matricula:</label>
            <input type="text" placeholder="Matricula" id="Matricula">
            <br>
            <br>
            <Label for="Correo">Correo:</Label>
            <input type="email" placeholder="Correo" id="Correo">
            <label for="Telefono">Telefono:</label>
            <input type="tel" placeholder="telefono" id="Telefono">
            <br>
            <br>
            <Label for="Contraseña">Contraseña:</Label>
            <input type="Password" placeholder="Contraseña" id="Contraseña">
            <Label For="Confirmar Contraseña">Confirmar Contraseña:</Label>
            <input type="text" placeholder="Confirmar Contraseña" id="Confirmar">
            <br>
            <br>
            <button><a href="paginaweb2.html">Registrar</a></button>
